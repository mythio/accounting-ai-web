<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="agent-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efff"/>
      <stop offset="1" stop-color="#e4d9ff"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="128" height="128" rx="28" fill="url(#agent-bg)"/>

  <!-- 披风 -->
  <path d="M64 62 L46 98 Q64 106 82 98 Z" fill="#a78bfa"/>

  <!-- 天线 + 星星 -->
  <line x1="64" y1="18" x2="64" y2="10" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 2 Q66.5 8 72 9.5 Q66.5 11 64 17 Q61.5 11 56 9.5 Q61.5 8 64 2 Z" fill="#ffd166"/>

  <!-- 耳朵 -->
  <circle cx="35" cy="44" r="4.5" fill="#d5c4ff"/>
  <circle cx="93" cy="44" r="4.5" fill="#d5c4ff"/>

  <!-- 头部 -->
  <circle cx="64" cy="44" r="27" fill="#ffffff"/>

  <!-- 眼睛 -->
  <circle cx="53" cy="42" r="4.5" fill="#334155"/>
  <circle cx="75" cy="42" r="4.5" fill="#334155"/>
  <circle cx="54.8" cy="40.2" r="1.6" fill="#ffffff"/>
  <circle cx="76.8" cy="40.2" r="1.6" fill="#ffffff"/>

  <!-- 腮红 -->
  <ellipse cx="42" cy="52" rx="4" ry="2.6" fill="#ffb3c7"/>
  <ellipse cx="86" cy="52" rx="4" ry="2.6" fill="#ffb3c7"/>

  <!-- 微笑 -->
  <path d="M58 56 Q64 62 70 56" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 身体 -->
  <rect x="48" y="70" width="32" height="26" rx="12" fill="#8b5cf6"/>

  <!-- 胸前星星 -->
  <path d="M64 76 Q66.5 82 72 83.5 Q66.5 85 64 91 Q61.5 85 56 83.5 Q61.5 82 64 76 Z" fill="#ffe08a"/>

  <!-- 光点 -->
  <circle cx="101" cy="34" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="25" cy="96" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>
