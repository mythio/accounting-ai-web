  <circle cx="64" cy="89" r="12" fill="#ffd166"/>
  <circle cx="64" cy="89" r="12" fill="none" stroke="#f4b740" stroke-width="2"/>
  <text x="64" y="94" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b7791f" text-anchor="middle">¥</text>

  <!-- 小星星 -->
  <path d="M100 22 Q102 27 107 29 Q102 31 100 36 Q98 31 93 29 Q98 27 100 22 Z" fill="#ffffff" opacity="0.9"/>
