<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="finance-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="128" height="128" rx="28" fill="url(#finance-bg)"/>

  <!-- 天线 -->
  <line x1="64" y1="22" x2="64" y2="13" stroke="#6f9bff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="11" r="4" fill="#ffd166"/>

  <!-- 耳朵 -->
  <circle cx="35" cy="48" r="4.5" fill="#a9c7ff"/>
  <circle cx="93" cy="48" r="4.5" fill="#a9c7ff"/>

  <!-- 头部 -->
  <circle cx="64" cy="48" r="27" fill="#ffffff"/>

  <!-- 眼睛 -->
  <circle cx="53" cy="46" r="4.5" fill="#334155"/>
  <circle cx="75" cy="46" r="4.5" fill="#334155"/>
  <circle cx="54.8" cy="44.2" r="1.6" fill="#ffffff"/>
  <circle cx="76.8" cy="44.2" r="1.6" fill="#ffffff"/>

  <!-- 腮红 -->
  <ellipse cx="42" cy="56" rx="4" ry="2.6" fill="#ffb3c7"/>
  <ellipse cx="86" cy="56" rx="4" ry="2.6" fill="#ffb3c7"/>

  <!-- 微笑 -->
  <path d="M58 60 Q64 66 70 60" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 身体 -->
